name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Code style and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: Code style (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan level 8)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  tests:
    name: Tests, PHP ${{ matrix.php }}, ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        db: [sqlite, pgsql]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: webhooks
          POSTGRES_USER: webhooks
          POSTGRES_PASSWORD: webhooks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhooks -d webhooks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pdo_sqlite, bcmath, mbstring, pcntl
          coverage: none

      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests (SQLite in memory)
        if: matrix.db == 'sqlite'
        run: php artisan test

      - name: Tests (PostgreSQL)
        if: matrix.db == 'pgsql'
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: webhooks
          DB_USERNAME: webhooks
          DB_PASSWORD: webhooks
        run: php artisan test
